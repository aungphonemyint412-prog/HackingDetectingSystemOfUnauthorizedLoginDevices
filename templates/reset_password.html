{% extends 'base.html' %}
{% block title %}Reset Password – HDS{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">

    <div class="auth-brand">
      <i class="fas fa-shield-halved text-primary"></i>
      <h4 class="mb-0 ms-2 fw-bold">HDS</h4>
    </div>

    <h2 class="auth-title">Set New Password</h2>
    <p class="auth-subtitle">
      Hi <strong>{{ username }}</strong>, choose a strong new password for your account.
    </p>

    <form method="POST" action="{{ url_for('reset_password') }}" novalidate>
      <div class="mb-3">
        <label for="new_password" class="form-label">New Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
          <input type="password" class="form-control" id="new_password" name="new_password"
                 placeholder="At least 8 characters" required autofocus>
          <button class="btn btn-outline-secondary" type="button" id="togglePwd1"
                  title="Show/hide">
            <i class="fas fa-eye" id="eyeIcon1"></i>
          </button>
        </div>
      </div>

      <div class="mb-4">
        <label for="confirm_password" class="form-label">Confirm New Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
          <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                 placeholder="Repeat your new password" required>
          <button class="btn btn-outline-secondary" type="button" id="togglePwd2"
                  title="Show/hide">
            <i class="fas fa-eye" id="eyeIcon2"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
        <i class="fas fa-key me-2"></i>Reset Password
      </button>
    </form>

  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function wireToggle(btnId, iconId, inputId) {
  document.getElementById(btnId).addEventListener('click', function () {
    const inp  = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    inp.type = inp.type === 'password' ? 'text' : 'password';
    icon.classList.toggle('fa-eye');
    icon.classList.toggle('fa-eye-slash');
  });
}
wireToggle('togglePwd1', 'eyeIcon1', 'new_password');
wireToggle('togglePwd2', 'eyeIcon2', 'confirm_password');
</script>
{% endblock %}
