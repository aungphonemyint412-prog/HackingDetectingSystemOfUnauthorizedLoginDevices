{% extends 'base.html' %}
{% block title %}Forgot Password – HDS{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">

    <div class="auth-brand">
      <i class="fas fa-shield-halved text-primary"></i>
      <h4 class="mb-0 ms-2 fw-bold">HDS</h4>
    </div>

    <h2 class="auth-title">Forgot Password</h2>
    <p class="auth-subtitle">
      Enter your account email and we'll send you a 6-digit reset code.
    </p>

    <form method="POST" action="{{ url_for('forgot_password') }}" novalidate>
      <div class="mb-4">
        <label for="email" class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
          <input type="email" class="form-control" id="email" name="email"
                 placeholder="Enter your registered email" required autofocus>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
        <i class="fas fa-paper-plane me-2"></i>Send Reset Code
      </button>
    </form>

    <p class="text-center mt-4 text-muted small">
      Remembered your password?
      <a href="{{ url_for('login') }}" class="auth-link">Back to login</a>
    </p>

  </div>
</div>
{% endblock %}
